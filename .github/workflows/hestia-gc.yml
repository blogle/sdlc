name: SDLC Hestia cache GC
on:
  # SDLC dogfoods the cache-maintenance workflow; consumers call it on
  # their own schedule through workflow_call.
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show garbage-collection changes without deleting cache entries
        type: boolean
        default: false
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  actions: write

jobs:
  gc:
    # Never allow a non-default-branch invocation to delete shared caches.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    concurrency:
      group: hestia-gc-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: Mic92/hestia@v3
      - name: Garbage-collect unused Hestia cache entries
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$DRY_RUN" == true ]]; then
            args+=(--dry-run)
          fi
          "$HESTIA_BIN" gc "${args[@]}"
