name: SDLC self-release

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [SDLC rolling release reconcile]
    types: [completed]

# Dogfood the same protected-main reconciliation path as consumers. The
# reusable workflow owns the one reconciliation; this caller never pushes
# main, creates a release PR, tags, or publishes directly.
permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  publisher-completion:
    name: accept publisher completion event
    runs-on: ubuntu-latest
    outputs:
      reconcile: ${{ steps.guard.outputs.reconcile }}
    steps:
      - id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != workflow_run ]]; then
            echo 'reconcile=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$WORKFLOW_EVENT" == workflow_dispatch ]] || { echo 'reconcile=false' >> "$GITHUB_OUTPUT"; exit 0; }
          [[ "$WORKFLOW_BRANCH" == main ]] || { echo 'reconcile=false' >> "$GITHUB_OUTPUT"; exit 0; }
          jobs="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$WORKFLOW_RUN_ID/jobs")"
          publisher_conclusion="$(jq -r '[.[][] | select(.name == "publish" or (.name | startswith("publish / "))) | .conclusion] | if length == 1 then .[0] else "ambiguous" end' <<<"$jobs")"
          [[ "$publisher_conclusion" != skipped && "$publisher_conclusion" != ambiguous ]] || { echo 'reconcile=false' >> "$GITHUB_OUTPUT"; exit 0; }
          echo 'reconcile=true' >> "$GITHUB_OUTPUT"
  reconcile:
    needs: publisher-completion
    if: needs.publisher-completion.outputs.reconcile == 'true'
    uses: ./.github/workflows/release.yml
    with:
      merged_sha: ""
      activate: false
    secrets: inherit
