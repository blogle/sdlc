name: SDLC release gate

on:
  workflow_call:
    inputs:
      sdlc_ref:
        description: Pinned SDLC flake reference, or empty for the trusted checkout
        type: string
        required: false
        default: ""
    secrets:
      SDLC_RELEASE_APP_ID:
        required: true
      SDLC_RELEASE_APP_PRIVATE_KEY:
        required: true
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_run:
    workflows: [SDLC CI]
    types: [completed]

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  pull-request-gate:
    name: release gate driver
    if: github.event_name == 'pull_request_target' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # This is deliberately the trusted base workflow, never PR code.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@v1
        id: release-app
        with:
          app-id: ${{ secrets.SDLC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SDLC_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
      - name: Verify and publish head-specific gate
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_BOT_LOGIN: ${{ vars.SDLC_RELEASE_BOT_LOGIN }}
          RELEASE_APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          SDLC_FLAKE: ${{ inputs.sdlc_ref != '' && inputs.sdlc_ref || github.workspace }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request_target' ]]; then
            pr_numbers="$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")"
          else
            pr_numbers="$(jq -r '.workflow_run.pull_requests[]?.number' "$GITHUB_EVENT_PATH")"
            if [[ -z "$pr_numbers" ]]; then
              pr_numbers="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=${GITHUB_REPOSITORY%%/*}:sdlc/release-next" --jq '.[].number')"
            fi
          fi
          for pr_number in $pr_numbers; do
            pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
            [[ "$(jq -r '.base.ref' <<<"$pr_json")" == "$DEFAULT_BRANCH" ]] || continue
            [[ "$(jq -r '.head.ref' <<<"$pr_json")" == 'sdlc/release-next' ]] || continue
            head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || continue
            git fetch --no-tags origin "$head_sha"
            set +e
            nix run "$SDLC_FLAKE"#sdlc -- release gate --repo "$GITHUB_REPOSITORY" --pr "$pr_number" --release-bot "$RELEASE_BOT_LOGIN" --app-slug "$RELEASE_APP_SLUG"
            result=$?
            set -e
            conclusion=failure
            [[ "$result" -eq 0 ]] && conclusion=success
            gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
              -f name='sdlc / release-gate' -f head_sha="$head_sha" \
              -f status=completed -f conclusion="$conclusion" \
              -f 'output[title]=Release gate' -f 'output[summary]=Release candidate validation completed.'
            [[ "$result" -eq 0 ]] || exit "$result"
          done

  base-refresh:
    name: refresh release gate after main advances
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@v1
        id: release-app
        with:
          app-id: ${{ secrets.SDLC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SDLC_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
      - name: Revalidate every open release head
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_BOT_LOGIN: ${{ vars.SDLC_RELEASE_BOT_LOGIN }}
          RELEASE_APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          SDLC_FLAKE: ${{ inputs.sdlc_ref != '' && inputs.sdlc_ref || github.workspace }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
            prs="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=$DEFAULT_BRANCH&head=${GITHUB_REPOSITORY%%/*}:sdlc/release-next" --jq '.[].number')"
          for pr in $prs; do
            head_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.sha')"
            git fetch --no-tags origin "$head_sha"
            set +e
            nix run "$SDLC_FLAKE"#sdlc -- release gate --repo "$GITHUB_REPOSITORY" --pr "$pr" --release-bot "$RELEASE_BOT_LOGIN" --app-slug "$RELEASE_APP_SLUG"
            result=$?
            set -e
            conclusion=failure
            [[ "$result" -eq 0 ]] && conclusion=success
            gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
              -f name='sdlc / release-gate' -f head_sha="$head_sha" \
              -f status=completed -f conclusion="$conclusion" \
              -f 'output[title]=Release gate refresh' -f 'output[summary]=Release candidate revalidated after main advanced.'
            [[ "$result" -eq 0 ]] || exit "$result"
          done
