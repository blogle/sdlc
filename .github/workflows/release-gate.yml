name: SDLC release gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  pull-request-gate:
    name: sdlc / release-gate
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@v1
        id: release-app
        if: github.event.pull_request.head.ref == 'sdlc/release-next'
        with:
          app-id: ${{ secrets.SDLC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SDLC_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
          permission-checks: read
      - name: Run release-only gate
        if: github.event.pull_request.head.ref == 'sdlc/release-next'
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_BOT_LOGIN: ${{ vars.SDLC_RELEASE_BOT_LOGIN }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_EVENT_PULL_REQUEST_HEAD_SHA"
          python3 src/release_gate.py --repo "$GITHUB_REPOSITORY" --pr "$GITHUB_EVENT_PULL_REQUEST_NUMBER" --release-bot "$RELEASE_BOT_LOGIN"
  base-refresh:
    name: revalidate release candidates after main advances
    if: github.event_name == 'push'
    permissions:
      contents: read
      checks: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@v1
        id: release-app
        with:
          app-id: ${{ secrets.SDLC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SDLC_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
      - name: Revalidate live release heads
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_BOT_LOGIN: ${{ vars.SDLC_RELEASE_BOT_LOGIN }}
        run: |
          set -euo pipefail
          # This trusted main-push job refreshes the head-specific check. It
          # does not enable repository-wide strict freshness.
          prs="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$GITHUB_REPOSITORY:sdlc/release-next" --jq '.[].number')"
          for pr in $prs; do
            head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.sha')"
            git fetch --no-tags origin "$head"
            set +e
            python3 src/release_gate.py --repo "$GITHUB_REPOSITORY" --pr "$pr" --release-bot "$RELEASE_BOT_LOGIN"
            result=$?
            set -e
            conclusion=failure
            [[ "$result" -eq 0 ]] && conclusion=success
            gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
              -f name='sdlc / release-gate' -f head_sha="$head" \
              -f status=completed -f conclusion="$conclusion"
            [[ "$result" -eq 0 ]] || exit "$result"
          done
