name: SDLC release gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  pull-request-gate:
    name: release gate driver
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # This is deliberately the trusted base workflow, never PR code.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@v1
        id: release-app
        if: github.event.pull_request.head.ref == 'sdlc/release-next'
        with:
          app-id: ${{ secrets.SDLC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SDLC_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
      - name: Verify and publish head-specific gate
        if: github.event.pull_request.head.ref == 'sdlc/release-next'
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_BOT_LOGIN: ${{ vars.SDLC_RELEASE_BOT_LOGIN }}
        run: |
          set -euo pipefail
          pr_number="$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")"
          head_sha="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
          git fetch --no-tags origin "$head_sha"
          set +e
          python3 src/release_gate.py gate --repo "$GITHUB_REPOSITORY" --pr "$pr_number" --release-bot "$RELEASE_BOT_LOGIN"
          result=$?
          set -e
          conclusion=failure
          [[ "$result" -eq 0 ]] && conclusion=success
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name='sdlc / release-gate' -f head_sha="$head_sha" \
            -f status=completed -f conclusion="$conclusion" \
            -f 'output[title]=Release gate' -f 'output[summary]=Release candidate validation completed.'
          [[ "$result" -eq 0 ]] || exit "$result"

  base-refresh:
    name: refresh release gate after main advances
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@v1
        id: release-app
        with:
          app-id: ${{ secrets.SDLC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SDLC_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
          permission-checks: write
      - name: Revalidate every open release head
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_BOT_LOGIN: ${{ vars.SDLC_RELEASE_BOT_LOGIN }}
        run: |
          set -euo pipefail
          prs="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$GITHUB_REPOSITORY:sdlc/release-next" --jq '.[].number')"
          for pr in $prs; do
            head_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.sha')"
            git fetch --no-tags origin "$head_sha"
            set +e
            python3 src/release_gate.py gate --repo "$GITHUB_REPOSITORY" --pr "$pr" --release-bot "$RELEASE_BOT_LOGIN"
            result=$?
            set -e
            conclusion=failure
            [[ "$result" -eq 0 ]] && conclusion=success
            gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
              -f name='sdlc / release-gate' -f head_sha="$head_sha" \
              -f status=completed -f conclusion="$conclusion" \
              -f 'output[title]=Release gate refresh' -f 'output[summary]=Release candidate revalidated after main advanced.'
            [[ "$result" -eq 0 ]] || exit "$result"
          done
