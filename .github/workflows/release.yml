name: SDLC rolling release reconcile
on:
  workflow_call:
    inputs:
      merged_sha:
        description: Actual squash-merged release commit on main
        type: string
        required: false
        default: ""
      activate:
        description: Explicit production activation after credential verification
        type: boolean
        required: false
        default: false
      sdlc_ref:
        description: Pinned SDLC flake reference, or empty for the trusted checkout
        type: string
        required: false
        default: ""
    secrets:
      SDLC_RELEASE_APP_ID:
        required: true
      SDLC_RELEASE_APP_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      merged_sha:
        description: Actual squash-merged release commit on main
        required: true
        type: string
      activate:
        description: Explicit production activation after credential verification
        required: true
        type: boolean
        default: false
      sdlc_ref:
        description: Pinned SDLC flake reference, or empty for the trusted checkout
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  reconcile:
    if: inputs.merged_sha == ''
    uses: ./.github/workflows/release-reconcile.yml
    with:
      sdlc_ref: ${{ inputs.sdlc_ref }}
    secrets: inherit

  publish:
    if: inputs.merged_sha != ''
    uses: ./.github/workflows/release-publish.yml
    with:
      merged_sha: ${{ inputs.merged_sha }}
      activate: ${{ inputs.activate }}
      sdlc_ref: ${{ inputs.sdlc_ref }}
    secrets: inherit
