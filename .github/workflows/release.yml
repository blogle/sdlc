name: SDLC release and publication
on:
  workflow_call:
    inputs:
      publish_version:
        description: Existing release version to republish after a publication failure
        type: string
        required: false
        default: ""
    secrets:
      SDLC_RELEASE_APP_ID:
        required: true
      SDLC_RELEASE_APP_PRIVATE_KEY:
        required: true
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/create-github-app-token@v1
        id: release-app
        with:
          app-id: ${{ secrets.SDLC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SDLC_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.release-app.outputs.token }}
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            substituters = https://cache.nixos.org/ https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - uses: Mic92/hestia@v3
      - name: Plan release from consumer fragments
        id: plan
        env:
          PUBLISH_VERSION: ${{ inputs.publish_version }}
        run: |
          set -euo pipefail
          if [[ -n "$PUBLISH_VERSION" ]]; then
            [[ "$PUBLISH_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            git rev-parse --verify "refs/tags/v${PUBLISH_VERSION}" >/dev/null
            printf 'release=true\nversion=%s\n' "$PUBLISH_VERSION" >> "$GITHUB_OUTPUT"
          else
            plan="$(nix run .#sdlc -- changelog plan --json)"
            release="$(jq -r '.release' <<< "$plan")"
            printf 'release=%s\n' "$release" >> "$GITHUB_OUTPUT"
            if [[ "$release" == true ]]; then
              printf 'version=%s\n' "$(jq -r '.version' <<< "$plan")" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Finalize changelog and tag
        if: steps.plan.outputs.release == 'true' && inputs.publish_version == ''
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          nix run .#sdlc -- changelog finalize --version "$RELEASE_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .changes
          git commit -m "docs: finalize release v${RELEASE_VERSION}"
          git tag -a "v${RELEASE_VERSION}" -m "Release v${RELEASE_VERSION}"
          git push --atomic origin HEAD:main "refs/tags/v${RELEASE_VERSION}"
      - name: Publish previously validated artifacts
        if: steps.plan.outputs.release == 'true'
        env:
          SDLC_RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        run: nix develop -c just release-publish "${SDLC_RELEASE_VERSION}"
