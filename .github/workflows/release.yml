name: SDLC rolling release reconcile
on:
  workflow_call:
    inputs:
      publish_version:
        description: Reserved for the post-merge publisher; milestone 1/2 fail closed.
        type: string
        required: false
        default: ""
    secrets:
      SDLC_RELEASE_APP_ID:
        required: true
      SDLC_RELEASE_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sdlc-release-reconcile-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  reconcile:
    if: inputs.publish_version == ''
    uses: ./.github/workflows/release-reconcile.yml
    secrets: inherit

  publication-not-implemented:
    if: inputs.publish_version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed until post-merge publication is implemented
        run: |
          printf 'publish_version=%s is unavailable in rolling-release milestones 1/2\n' '${{ inputs.publish_version }}' >&2
          exit 1
