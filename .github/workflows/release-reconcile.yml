name: SDLC rolling release reconcile
on:
  workflow_call:
    inputs:
      sdlc_ref:
        description: Pinned SDLC flake reference, or empty for the trusted checkout
        type: string
        required: false
        default: ""
    secrets:
      SDLC_RELEASE_APP_ID:
        required: true
      SDLC_RELEASE_APP_PRIVATE_KEY:
        required: true

concurrency:
  group: sdlc-release-reconcile-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@v1
        id: release-app
        with:
          app-id: ${{ secrets.SDLC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SDLC_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.release-app.outputs.token }}
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            substituters = https://cache.nixos.org/ https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - name: Reconcile one rolling release PR
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          SDLC_FLAKE: ${{ inputs.sdlc_ref != '' && inputs.sdlc_ref || github.workspace }}
          SDLC_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          nix run "$SDLC_FLAKE"#sdlc -- release reconcile --repo "$GITHUB_REPOSITORY"
