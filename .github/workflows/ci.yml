name: SDLC CI
on:
  workflow_call:
    inputs:
      sdlc_ref:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: sdlc-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    uses: ./.github/workflows/stage.yml
    with:
      stage: check
      sdlc_ref: ${{ inputs.sdlc_ref || github.sha }}
  check-context:
    name: check
    if: always() && github.event_name != 'merge_group'
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Require check stage
        env:
          STAGE_RESULT: ${{ needs.check.result }}
        run: |
          set -euo pipefail
          test "$STAGE_RESULT" = success
  pr-fast-context:
    # Temporary bridge for consumers still carrying the legacy pr-fast ruleset context.
    name: pr-fast
    if: always() && github.event_name == 'pull_request'
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Preserve legacy admission context
        env:
          STAGE_RESULT: ${{ needs.check.result }}
        run: test "$STAGE_RESULT" = success
  verify:
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'mergify/merge-queue/')) ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    uses: ./.github/workflows/stage.yml
    with:
      stage: verify
      sdlc_ref: ${{ inputs.sdlc_ref || github.sha }}
  verify-context:
    name: verify
    if: always() && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'mergify/merge-queue/')))
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require verify stage
        env:
          STAGE_RESULT: ${{ needs.verify.result }}
        run: test "$STAGE_RESULT" = success
  policy:
    name: policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix run .#sdlc -- install --check
