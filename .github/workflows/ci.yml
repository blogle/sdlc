name: SDLC CI
on:
  workflow_call:
  pull_request:
  merge_group:
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: sdlc-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: >-
          github.event_name != 'pull_request' ||
          !contains(github.event.pull_request.labels.*.name, 'release')
      - uses: DeterminateSystems/nix-installer-action@v23
        if: >-
          github.event_name != 'pull_request' ||
          !contains(github.event.pull_request.labels.*.name, 'release')
        with:
          extra-conf: |
            substituters = https://cache.nixos.org https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - name: Fast application checks
        if: >-
          github.event_name != 'pull_request' ||
          !contains(github.event.pull_request.labels.*.name, 'release')
        run: nix build --no-link .#checks.x86_64-linux.sdlc-fast
      - name: Release PR fast-check context
        if: >-
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'release')
        run: echo 'Application checks are replaced by the generated-content release gate.'
  verify:
    name: verify
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'mergify/merge-queue/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            substituters = https://cache.nixos.org https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - run: nix build --no-link .#checks.x86_64-linux.sdlc-verify
  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            substituters = https://cache.nixos.org https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - run: nix run .#sdlc -- install --check
