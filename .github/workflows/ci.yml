name: SDLC CI
on:
  workflow_call:
    inputs:
      sdlc_ref:
        type: string
        required: true
  pull_request:
  merge_group:
  push:
    branches: [main, master]
permissions:
  contents: read
  actions: read
concurrency:
  group: sdlc-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: >-
      (github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'release'))
    uses: ./.github/workflows/stage.yml
    with:
      stage: check
      sdlc_ref: ${{ inputs.sdlc_ref || github.sha }}
  check-context:
    name: ${{ inputs.sdlc_ref && 'check' || 'sdlc / check' }}
    if: always() && github.event_name != 'merge_group'
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Require fast stage unless release-specific validation owns the PR
        env:
          STAGE_RESULT: ${{ needs.check.result }}
          IS_RELEASE: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release') }}
        run: |
          set -euo pipefail
          if [[ "$IS_RELEASE" == true ]]; then
            test "$STAGE_RESULT" = skipped
          else
            test "$STAGE_RESULT" = success
          fi
  verify:
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'mergify/merge-queue/')) ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    uses: ./.github/workflows/stage.yml
    with:
      stage: verify
      sdlc_ref: ${{ inputs.sdlc_ref || github.sha }}
  verify-context:
    name: ${{ inputs.sdlc_ref && 'verify' || 'sdlc / verify' }}
    if: always() && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'mergify/merge-queue/')))
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require verify stage
        env:
          STAGE_RESULT: ${{ needs.verify.result }}
        run: test "$STAGE_RESULT" = success
  policy:
    name: ${{ inputs.sdlc_ref && 'policy' || 'sdlc / policy' }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v23
      - run: nix run .#sdlc -- install --check
