name: SDLC candidate
on:
  workflow_call:
    inputs:
      sdlc_ref:
        type: string
        default: v1
        required: false
jobs:
  candidate:
    name: sdlc / candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v15
        with:
          name: hestia
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Run declared candidate stage
        run: nix run github:blogle/sdlc/${{ inputs.sdlc_ref }}#sdlc -- run candidate
