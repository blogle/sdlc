name: SDLC candidate
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  stage:
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'mergify/merge-queue/')) ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    uses: $/.github/workflows/stage.yml
    with:
      stage: candidate
