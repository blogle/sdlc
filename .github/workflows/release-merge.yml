name: SDLC release merge

on:
  workflow_call:
    inputs:
      sdlc_ref:
        description: Pinned SDLC flake reference, or empty for the trusted checkout
        type: string
        required: false
        default: ""
    secrets:
      SDLC_RELEASE_APP_ID:
        required: true
      SDLC_RELEASE_APP_PRIVATE_KEY:
        required: true
  workflow_run:
    workflows: [SDLC release gate]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: sdlc-release-merge-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  merge:
    name: merge validated release PR
    outputs:
      merged_sha: ${{ steps.merge-release.outputs.merged_sha }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            substituters = https://cache.nixos.org/ https://nix-community.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - uses: actions/create-github-app-token@v1
        id: release-app
        with:
          app-id: ${{ secrets.SDLC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SDLC_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-checks: read
      - name: Recheck and squash merge release PR
        id: merge-release
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_BOT_LOGIN: ${{ vars.SDLC_RELEASE_BOT_LOGIN }}
          RELEASE_APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          SDLC_FLAKE: ${{ inputs.sdlc_ref != '' && inputs.sdlc_ref || github.workspace }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
            prs="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=$DEFAULT_BRANCH&head=${GITHUB_REPOSITORY%%/*}:sdlc/release-next" --jq '.[].number')"
            if [[ -n "$prs" ]]; then
              for pr in $prs; do
                head_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.sha')"
                git fetch --no-tags origin "$head_sha"
                nix run "$SDLC_FLAKE"#sdlc -- release merge --repo "$GITHUB_REPOSITORY" --pr "$pr" --release-bot "$RELEASE_BOT_LOGIN" --app-slug "$RELEASE_APP_SLUG"
                merged_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.merge_commit_sha')"
                [[ "$merged_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "missing actual squash merged SHA" >&2; exit 1; }
                printf 'merged_sha=%s\n' "$merged_sha" >> "$GITHUB_OUTPUT"
              done
            else
              # Recover a release PR merged before a transient merger failure;
              # re-run the exact-head gate before handing its merged SHA to the
              # publisher. This is idempotent and never merges a closed PR.
              recovery="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=closed&base=$DEFAULT_BRANCH&head=${GITHUB_REPOSITORY%%/*}:sdlc/release-next&per_page=20" --jq '[.[] | select(.merged_at != null)] | .[0] | [.number, .head.sha, .merge_commit_sha] | @tsv')"
              if [[ -n "$recovery" ]]; then
                read -r pr head_sha merged_sha <<< "$recovery"
                git fetch --no-tags origin "$head_sha" "$merged_sha"
                nix run "$SDLC_FLAKE"#sdlc -- release gate --repo "$GITHUB_REPOSITORY" --pr "$pr" --release-bot "$RELEASE_BOT_LOGIN" --app-slug "$RELEASE_APP_SLUG" --historical-merged-sha "$merged_sha"
                [[ "$merged_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "missing recovered squash merged SHA" >&2; exit 1; }
                printf 'merged_sha=%s\n' "$merged_sha" >> "$GITHUB_OUTPUT"
              fi
            fi

  publish:
    name: publish actual merged release
    needs: merge
    if: needs.merge.result == 'success' && needs.merge.outputs.merged_sha != ''
    permissions:
      contents: write
      packages: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
    with:
      merged_sha: ${{ needs.merge.outputs.merged_sha }}
      activate: ${{ vars.SDLC_RELEASE_ACTIVATE == 'true' }}
    secrets: inherit
