name: SDLC release merge

on:
  workflow_run:
    workflows: [SDLC release gate]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: sdlc-release-merge-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  merge:
    name: merge validated release PR
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: write
      # The trusted built-in token dispatches the publisher workflow after the
      # App independently merges the release PR. No Actions-write App grant needed.
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@v1
        id: release-app
        with:
          app-id: ${{ secrets.SDLC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SDLC_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-checks: read
      - name: Recheck and squash merge release PR
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_BOT_LOGIN: ${{ vars.SDLC_RELEASE_BOT_LOGIN }}
          RELEASE_APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
        run: |
          set -euo pipefail
          prs="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=${GITHUB_REPOSITORY%%/*}:sdlc/release-next" --jq '.[].number')"
          for pr in $prs; do
            python3 src/release_gate.py merge --repo "$GITHUB_REPOSITORY" --pr "$pr" --release-bot "$RELEASE_BOT_LOGIN" --app-slug "$RELEASE_APP_SLUG"
            merged_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.merge_commit_sha')"
            [[ "$merged_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "missing actual squash merged SHA" >&2; exit 1; }
            # workflow_dispatch is expressly permitted to be triggered using
            # GITHUB_TOKEN. It avoids granting Actions write to the release App.
            GH_TOKEN="${{ github.token }}" gh workflow run release.yml --repo "$GITHUB_REPOSITORY" \
              -f merged_sha="$merged_sha" -f activate="${{ vars.SDLC_RELEASE_ACTIVATE == 'true' }}"
          done
