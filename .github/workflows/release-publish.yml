name: SDLC merged release publisher

# This is deliberately reusable-only in this PR. The updater/release-gate PR
# will call it after the already-provisioned canonical main protection is
# verified and the release-gate check is ready.
on:
  workflow_call:
    inputs:
      merged_sha:
        description: Actual squash-merged release commit on main
        required: true
        type: string
      ledger_artifact:
        description: Prior durable ledger artifact to resume, when available
        required: false
        type: string
        default: ""
      activate:
        description: Explicit opt-in while the updater and release gate are live
        required: false
        type: boolean
        default: false
    secrets:
      SDLC_RELEASE_APP_ID:
        required: true
      SDLC_RELEASE_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: sdlc-release-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    # Do not activate production publication until the updater and release
    # gate are ready; canonical ruleset verification is still fail-closed.
    if: ${{ inputs.activate }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: release-app
        with:
          app-id: ${{ secrets.SDLC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SDLC_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-actions: read
          permission-pull-requests: write
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merged_sha }}
          fetch-depth: 0
          token: ${{ steps.release-app.outputs.token }}
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: Mic92/hestia@v3
      - name: Verify canonical protection before publication
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          rulesets="$(gh api "repos/${GITHUB_REPOSITORY}/rulesets" --paginate)"
          REPOSITORY="$REPOSITORY" python3 -c 'import json,os,sys; data=json.load(sys.stdin); repo=os.environ["REPOSITORY"]; matches=[x for x in data if x.get("name") == "SDLC default branch" and x.get("source", repo) == repo and x.get("enforcement") == "active"]; raise SystemExit("canonical active ruleset missing; refusing publication") if len(matches) != 1 else None' <<<"$rulesets"
      - name: Resume durable ledger when supplied
        if: ${{ inputs.ledger_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.ledger_artifact }}
          path: .sdlc
      - name: Validate merged identity and build immutable artifacts
        env:
          MERGED_SHA: ${{ inputs.merged_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGED_SHA"
          git fetch origin main --tags
          git merge-base --is-ancestor "$MERGED_SHA" FETCH_HEAD
          python3 src/release_publisher.py "$MERGED_SHA" > identity.json
          test -f .sdlc/release.json
          mkdir -p .sdlc
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, 'src')
          from release_publisher import ArtifactLedger, validate_checkout
          manifest = json.loads(Path('.sdlc/release.json').read_text())
          identity = validate_checkout(subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip())
          ledger = ArtifactLedger.load_or_create(Path('.sdlc/release-ledger.json'), identity)
          artifacts = manifest['publication']['artifacts']
          if set(ledger.data['artifacts']) != {item['name'] for item in artifacts}:
              command = manifest.get('publication', {}).get('build_command')
              if not isinstance(command, str) or not command.strip():
                  raise SystemExit('manifest lacks publication.build_command; refusing to guess a build')
              subprocess.run(command, shell=True, check=True)
              for artifact in artifacts:
                  path = Path(artifact.get('path', ''))
                  if not path.is_file():
                      raise SystemExit(f'manifest artifact path is not a file: {path}')
                  digest = 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
                  if artifact.get('digest') and artifact['digest'] != digest:
                      raise SystemExit(f'artifact digest mismatch: {artifact["name"]}')
                  ledger.record_artifact(artifact['name'], digest)
          ledger.save()
          PY
      - name: Save immutable artifact ledger
        uses: actions/upload-artifact@v4
        with:
          name: release-ledger-${{ inputs.merged_sha }}-built
          path: .sdlc/release-ledger.json
          retention-days: 90
      - name: Tag exact merged release commit
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          MERGED_SHA: ${{ inputs.merged_sha }}
        run: |
          set -euo pipefail
          manifest_version="$(jq -r .version .sdlc/release.json)"
          tag="v${manifest_version}"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-list -n1 "$tag")" = "$MERGED_SHA" || { echo "conflicting tag $tag" >&2; exit 1; }
          else
            git tag -a "$tag" "$MERGED_SHA" -m "Release $tag source=$MERGED_SHA"
            git push origin "refs/tags/$tag"
          fi
      - name: Commit tagged state to durable ledger
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'src')
          from release_publisher import ArtifactLedger, ReleaseIdentity
          data = json.loads(Path('.sdlc/release-ledger.json').read_text())
          identity = ReleaseIdentity(data['version'], data['merged_sha'], data['source_main_sha'], data['tree_sha'], data['changelog_sha256'], tuple(map(tuple, data['fragments'])))
          ledger = ArtifactLedger.load_or_create(Path('.sdlc/release-ledger.json'), identity)
          ledger.mark_tagged()
          ledger.save()
          PY
      - name: Save tagged ledger
        uses: actions/upload-artifact@v4
        with:
          name: release-ledger-${{ inputs.merged_sha }}-tagged
          path: .sdlc/release-ledger.json
          retention-days: 90
      - name: Publish recorded bytes through consumer contract
        env:
          SDLC_RELEASE_LEDGER: .sdlc/release-ledger.json
        run: |
          set -euo pipefail
          version="$(jq -r .version .sdlc/release.json)"
          nix develop -c just release-publish "$version"
      - name: Commit published state to durable ledger
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'src')
          from release_publisher import ArtifactLedger, ReleaseIdentity
          data = json.loads(Path('.sdlc/release-ledger.json').read_text())
          identity = ReleaseIdentity(data['version'], data['merged_sha'], data['source_main_sha'], data['tree_sha'], data['changelog_sha256'], tuple(map(tuple, data['fragments'])))
          ledger = ArtifactLedger.load_or_create(Path('.sdlc/release-ledger.json'), identity)
          ledger.mark_published()
          ledger.save()
          PY
      - name: Save published ledger
        uses: actions/upload-artifact@v4
        with:
          name: release-ledger-${{ inputs.merged_sha }}-published
          path: .sdlc/release-ledger.json
          retention-days: 90
