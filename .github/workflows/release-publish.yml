name: SDLC merged release publisher
on:
  workflow_call:
    inputs:
      sdlc_ref:
        required: false
        type: string
        default: ""
      activate:
        required: false
        type: boolean
        default: false
      merged_sha:
        required: true
        type: string
    secrets:
      SDLC_RELEASE_APP_ID:
        required: true
      SDLC_RELEASE_APP_PRIVATE_KEY:
        required: true
permissions:
  contents: write
  packages: write
concurrency:
  group: sdlc-publish-${{ github.repository }}-${{ inputs.merged_sha }}
  cancel-in-progress: false
jobs:
  publish:
    if: inputs.activate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: release-app
        with:
          app-id: ${{ secrets.SDLC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SDLC_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merged_sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.release-app.outputs.token }}
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Validate actual merged release identity
        id: identity
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          SDLC_FLAKE: ${{ inputs.sdlc_ref != '' && inputs.sdlc_ref || github.workspace }}
          MERGED_SHA: ${{ inputs.merged_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH" --tags
          test "$(git rev-parse HEAD)" = "$MERGED_SHA"
          git merge-base --is-ancestor "$MERGED_SHA" FETCH_HEAD
          nix run "$SDLC_FLAKE"#sdlc -- release publish "$MERGED_SHA" > identity.json
          version="$(jq -r .version identity.json)"
          source_sha="$(jq -r .source_sha identity.json)"
          printf 'version=%s\nsource_sha=%s\n' "$version" "$source_sha" >> "$GITHUB_OUTPUT"
      - name: Create or verify version tag and source release asset
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          MERGED_SHA: ${{ inputs.merged_sha }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-list -n1 "$tag")" = "$MERGED_SHA" || { echo "conflicting release tag $tag" >&2; exit 1; }
          else
            git config user.name 'sdlc-release[bot]'
            git config user.email 'sdlc-release[bot]@users.noreply.github.com'
            git tag -a "$tag" "$MERGED_SHA" -m "Release $tag ($MERGED_SHA)"
            git push origin "refs/tags/$tag"
          fi
          asset="sdlc-source-$VERSION-$MERGED_SHA.tar.gz"
          git archive --format=tar.gz --output "$RUNNER_TEMP/$asset.expected" "$MERGED_SHA"
          if gh release view "$tag" >/dev/null 2>&1; then
            if gh release view "$tag" --json assets --jq ".assets[] | select(.name == \"$asset\") | .id" | grep -q .; then
              gh release download "$tag" --pattern "$asset" --dir "$RUNNER_TEMP"
              cmp "$RUNNER_TEMP/$asset.expected" "$RUNNER_TEMP/$asset"
            else
              gh release upload "$tag" "$RUNNER_TEMP/$asset.expected"
            fi
          else
            gh release create "$tag" "$RUNNER_TEMP/$asset.expected" --verify-tag --draft --title "$tag" --notes "Release $tag from $MERGED_SHA."
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish consumer artifacts from merged source
        env:
          SDLC_RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          SDLC_RELEASE_MERGED_SHA: ${{ inputs.merged_sha }}
          SDLC_RELEASE_SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          SDLC_RELEASE_RECEIPTS: ${{ runner.temp }}/publication-receipts.json
        run: |
          set -euo pipefail
          nix run .#sdlc-publish
          jq -e --arg version "$SDLC_RELEASE_VERSION" --arg merged "$SDLC_RELEASE_MERGED_SHA" --arg source "$SDLC_RELEASE_SOURCE_SHA" \
            '.schema == 1 and (.artifacts | length > 0) and all(.artifacts[]; .version == $version and .merged_sha == $merged and .source_sha == $source)' \
            "$SDLC_RELEASE_RECEIPTS" >/dev/null
          gh release edit "v$SDLC_RELEASE_VERSION" --draft=false
