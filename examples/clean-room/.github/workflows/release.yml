name: SDLC release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      merged_sha:
        description: Actual squash-merged release commit to publish
        required: false
        type: string
        default: ""
      activate:
        description: Explicitly activate publication
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  reconcile:
    uses: blogle/sdlc/.github/workflows/release.yml@v1.2.3
    with:
      merged_sha: ${{ inputs.merged_sha || '' }}
      activate: ${{ inputs.activate || false }}
      sdlc_ref: github:blogle/sdlc/v1.2.3
    secrets: inherit
