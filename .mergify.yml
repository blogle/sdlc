pull_request_rules:
  - name: automatically queue validated candidates
    conditions:
      - base ~= ^(main|master)$
      - check-success = "sdlc / pr-fast"
      - or:
          - and:
              - label = integration:auto
              - label != integration:review
          - and:
              - label = integration:review
              - label != integration:auto
              - "#approved-reviews-by >= 1"
    actions:
      queue:
        name: validated candidates

queue_rules:
  - name: validated candidates
    queue_conditions:
      - base ~= ^(main|master)$
      - check-success = "sdlc / pr-fast"
      - or:
          - and:
              - label = integration:auto
              - label != integration:review
          - and:
              - label = integration:review
              - label != integration:auto
              - "#approved-reviews-by >= 1"
    merge_conditions:
      - check-success = "sdlc / candidate"
    batch_size: 5
    batch_max_wait_time: 2 minutes
    merge_method: squash
    update_method: merge

commands_restrictions:
  queue:
    conditions:
      - or:
          - sender-permission >= write
          - sender = anvil-daemon[bot]

merge_queue:
  max_parallel_checks: 5
  mode: serial
  queue_controls_comment: true
  status_comments: all